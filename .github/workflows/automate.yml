name: Actualizacion Completa Licitaciones

on:
  workflow_dispatch:

  schedule:
    - cron: '0 5 * * *'

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Pull LFS files
        run: git lfs pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy pyarrow openpyxl
          pip install notebook jupyter nbconvert ipykernel

      - name: Ejecutar scraping
        run: |
          python Notebooks/scraper_contratacion.py

      - name: Ejecutar notebook de limpieza
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute Notebooks/Carga_Union_depuracion_DF.ipynb \
            --inplace

      - name: Generar dataset dashboard
        run: |
          python Notebooks/generate_dashboard_json.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion automatica licitaciones"
            git push
          else
            echo "No hay cambios para subir"
          fi