<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GovAI | Oportunidades de Licitación</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #f0f5fb;
      --border: #dfe7f1;
      --text: #142033;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: #e8f0ff;
      --green: #12a678;
      --green-soft: #e7f8f2;
      --orange: #f59e0b;
      --orange-soft: #fff3db;
    }
    * { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0; }
    body {
      background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 260px);
      color: var(--text);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(20, 32, 51, .06);
    }
    .location-select {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: white;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      padding: 0 44px 0 42px;
      outline: none;
      appearance: none;
      box-shadow: 0 10px 24px rgba(20, 32, 51, .05);
    }
    .location-select:focus {
      border-color: #9bb8ff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .10);
    }
    .metric-card {
      border-radius: 14px;
      border: 1px solid var(--border);
      background: white;
      padding: 14px;
    }
    .metric-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .prob-high { background: var(--green-soft); color: #057a55; border-color: #a7ead1; }
    .prob-mid { background: var(--orange-soft); color: #9a5b00; border-color: #ffd58a; }
    .prob-low { background: #eef2f7; color: #475569; border-color: #d8e1ec; }
    .skeleton {
      animation: pulse 1.2s infinite;
      background: linear-gradient(90deg, #edf2f9 25%, #e3ebf6 37%, #edf2f9 63%);
      background-size: 400% 100%;
    }
    .data-table th {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .data-table td {
      font-size: 12px;
      border-top: 1px solid var(--border);
      vertical-align: top;
    }
    @keyframes pulse {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
  </style>
</head>
<body>
  <main class="max-w-7xl mx-auto px-4 md:px-8 py-5 md:py-8">
    <header class="mb-5">
      <div class="flex items-center gap-3 min-w-fit">
        <div class="w-11 h-11 rounded-2xl bg-[var(--blue)] text-white flex items-center justify-center shadow-lg shadow-blue-200">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold">GovAI Opportunities</h1>
          <p class="text-sm text-[var(--muted)]">Inteligencia de licitaciones públicas</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-[1fr_340px] gap-3 mt-5">
        <div class="panel rounded-2xl px-5 py-4 flex items-center gap-3">
          <i class="fa-solid fa-magnifying-glass text-[var(--blue)]"></i>
          <input id="searchInput" class="w-full bg-transparent outline-none text-lg" aria-label="Buscar licitaciones" placeholder="Buscar licitaciones, organismo, CPV, expediente o ubicación..." />
        </div>
        <div class="relative">
          <label for="locationFilter" class="sr-only">Ubicación</label>
          <select id="locationFilter" class="location-select">
            <option value="">Todas las ubicaciones</option>
          </select>
          <i class="fa-solid fa-location-dot absolute left-4 top-1/2 -translate-y-1/2 text-[var(--blue)] pointer-events-none"></i>
          <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-[var(--muted)] pointer-events-none"></i>
        </div>
      </div>
    </header>

    <section class="mb-6">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3 mb-3">
        <div>
          <h2 class="text-2xl font-extrabold">Licitaciones destacadas</h2>
          <p class="text-sm text-[var(--muted)]"><span id="resultsCount">0</span> oportunidades encontradas</p>
        </div>
      </div>
      <section id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></section>
      <div class="text-center mt-4">
        <button id="loadMoreBtn" class="hidden px-5 py-2.5 rounded-xl border border-[var(--border)] bg-white hover:bg-[var(--panel-soft)] text-sm font-semibold">Cargar más</button>
      </div>
    </section>

  </main>

  <script>
    const DATASET_PATHS = [
      './data/Silver/licitaciones_abiertas.json',
      './data/licitaciones_abiertas.json'
    ];

    const state = {
  raw: [],
  filtered: [],
  visible: 18,
  filters: {
    q: '',
    ubicacion: ''
  }
};

    const REGION_MAP = {
      ES11: 'Galicia', ES12: 'Asturias', ES13: 'Cantabria', ES21: 'País Vasco', ES22: 'Navarra',
      ES23: 'La Rioja', ES24: 'Aragón', ES30: 'Madrid', ES41: 'Castilla y León', ES42: 'Castilla-La Mancha',
      ES43: 'Extremadura', ES51: 'Cataluña', ES52: 'Comunidad Valenciana', ES53: 'Illes Balears',
      ES61: 'Andalucía', ES62: 'Región de Murcia', ES63: 'Ceuta', ES64: 'Melilla', ES70: 'Canarias'
    };

    const PROVINCE_HINTS = [
      'Madrid','Barcelona','Valencia','Sevilla','Zaragoza','Málaga','Murcia','Palma','Bilbao','Alicante',
      'Córdoba','Valladolid','Vigo','Gijón','Hospitalet','A Coruña','Granada','Vitoria','Elche','Oviedo',
      'Badalona','Cartagena','Terrassa','Jerez','Sabadell','Móstoles','Alcalá','Pamplona','Santander'
    ];

    function safeText(v) { return (v ?? '').toString().trim(); }
    function escapeHtml(v) {
      return safeText(v).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function amount(v) {
      const n = Number(safeText(v).replace(/[^\d,.-]/g, '').replace(',', '.'));
      return Number.isFinite(n) ? n : 0;
    }
    function dateVal(v) {
      const d = new Date(v);
      return Number.isNaN(d.getTime()) ? null : d;
    }
    function formatEuro(n) {
      return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Number.isFinite(n) ? n : 0);
    }
    function daysUntil(d) {
      if (!d) return 9999;
      return Math.ceil((d.getTime() - Date.now()) / 86400000);
    }
    function locationName(row) {
      const text = `${safeText(row.lugar_ejecucion)} ${safeText(row.titulo)}`;
      const city = PROVINCE_HINTS.find(x => text.toLowerCase().includes(x.toLowerCase()));
      if (city) return city;
      const code = safeText(row.lugar_ejecucion_codigo || row.lugar_ejecucion).slice(0, 4).toUpperCase();
      return REGION_MAP[code] || safeText(row.lugar_ejecucion) || 'No especificado';
    }
    function probability(row) {
      let score = 50;
      const offers = amount(row.ofertas_recibidas);
      const budget = amount(row.importe_total || row.importe_sin_impuestos);
      const cpv = safeText(row.cpv_codes);
      const procedure = safeText(row.procedimiento_codigo);
      const estado = safeText(row.estado || row.estado_codigo).toLowerCase();

      if (!offers) score += 14;
      else if (offers <= 2) score += 18;
      else if (offers <= 5) score += 8;
      else score -= 10;

      if (budget > 0 && budget <= 150000) score += 12;
      else if (budget <= 750000) score += 7;
      else if (budget > 1500000) score -= 8;

      if (['1','2','9','10'].includes(procedure)) score += 6;
      if (estado.includes('evalu') || estado.includes('public')) score += 7;
      if (cpv.split(';').filter(Boolean).length <= 1) score += 5;
      else score -= 4;
      if (safeText(row.adjudicatario)) score -= 10;

      score = Math.max(8, Math.min(96, Math.round(score)));
      const label = score >= 75 ? 'Alta probabilidad' : score >= 50 ? 'Media probabilidad' : 'Baja probabilidad';
      const cls = score >= 75 ? 'prob-high' : score >= 50 ? 'prob-mid' : 'prob-low';
      return { score, label, cls };
    }
    function topCounts(rows, accessor, max = 8) {
      const map = {};
      rows.forEach(r => {
        const key = safeText(accessor(r)) || 'No especificado';
        map[key] = (map[key] || 0) + 1;
      });
      return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, max);
    }

    function enrich(rows) {
      return rows.map(row => {
        const title = safeText(row.titulo || row.title);
        const enriched = {
          ...row,
          title,
          __amount: amount(row.importe_total || row.importe_sin_impuestos),
          __noTax: amount(row.importe_sin_impuestos),
          __date: dateVal(row.fecha_publicacion),
          __deadline: dateVal(row.presentacion_hasta),
          __tipo: safeText(row.tipo_contrato || row.tipo_contrato_codigo) || 'No especificado',
          __estado: safeText(row.estado || row.estado_codigo) || 'No especificado',
          __org: safeText(row.organo_contratacion) || 'No especificado',
          __cpv: safeText(row.cpv_codes) || 'No especificado',
          __loc: locationName(row),
          __adjudicatario: safeText(row.adjudicatario)
        };
        enriched.__probability = probability(enriched);
        enriched.__blob = `${title} ${row.expediente} ${enriched.__org} ${enriched.__cpv} ${row.cpv_descripcion} ${enriched.__loc} ${enriched.__adjudicatario}`.toLowerCase();
        return enriched;
      });
    }

    function renderSkeleton() {
      document.getElementById('cardsContainer').innerHTML = Array.from({ length: 6 }).map(() => `
        <div class="panel rounded-2xl p-5"><div class="skeleton h-5 rounded w-4/5 mb-3"></div><div class="skeleton h-3 rounded w-2/3 mb-5"></div><div class="skeleton h-24 rounded"></div></div>
      `).join('');
    }

    function renderFilters() {
      const entries = topCounts(state.raw, r => r.__loc, 80);
      const select = document.getElementById('locationFilter');
      const current = select.value;
      select.innerHTML = '<option value="">Todas las ubicaciones</option>' + entries
        .map(([value]) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)
        .join('');
      select.value = current;
    }

    function applyFilters() {
      const f = state.filters;
      state.filtered = state.raw.filter(r => {
        if (f.q && !r.__blob.includes(f.q)) return false;
        if (f.ubicacion && r.__loc !== f.ubicacion) return false;
        return true;
      }).sort((a, b) => b.__probability.score - a.__probability.score || (a.__deadline?.getTime() || 0) - (b.__deadline?.getTime() || 0));

      state.visible = Math.min(state.visible, Math.max(18, state.filtered.length));
      state.tablePage = 1;
      renderAll();
    }

    function renderCards() {
      const rows = state.filtered.slice(0, state.visible);
      document.getElementById('resultsCount').textContent = state.filtered.length.toLocaleString('es-ES');
      const container = document.getElementById('cardsContainer');
      if (!rows.length) {
        container.innerHTML = '<div class="panel rounded-2xl p-8 text-center md:col-span-2 xl:col-span-3"><h3 class="text-xl font-extrabold mb-2">Sin resultados</h3><p class="text-sm text-[var(--muted)]">Prueba con otros filtros o una búsqueda más amplia.</p></div>';
        document.getElementById('loadMoreBtn').classList.add('hidden');
        return;
      }
      container.innerHTML = rows.map(r => `
        <article class="panel rounded-2xl p-5 hover:shadow-xl transition">
          <div class="flex items-start justify-between gap-3 mb-3">
            <h3 class="font-extrabold leading-snug">${escapeHtml(r.title)}</h3>
            <span class="text-xs font-extrabold px-2 py-1 rounded-full border ${r.__probability.cls}">${r.__probability.score}%</span>
          </div>
          <p class="text-xs text-[var(--muted)] mb-4">${escapeHtml(r.expediente)} Â· ${escapeHtml(r.__org)}</p>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div><p class="text-[var(--muted)]">Ubicación</p><p class="font-bold">${escapeHtml(r.__loc)}</p></div>
            <div><p class="text-[var(--muted)]">Presupuesto</p><p class="font-bold">${formatEuro(r.__amount)}</p></div>
            <div><p class="text-[var(--muted)]">Fecha límite</p><p class="font-bold">${r.__deadline ? r.__deadline.toLocaleDateString('es-ES') : '-'}</p></div>
            <div><p class="text-[var(--muted)]">Estado</p><p class="font-bold">${escapeHtml(r.__estado)}</p></div>
            <div><p class="text-[var(--muted)]">Tipo</p><p class="font-bold">${escapeHtml(r.__tipo)}</p></div>
            <div><p class="text-[var(--muted)]">CPV</p><p class="font-bold">${escapeHtml(r.__cpv)}</p></div>
          </div>
          <div class="flex items-center justify-between gap-3 mt-4">
            <span class="text-xs font-bold px-2 py-1 rounded-full border ${r.__probability.cls}">${r.__probability.label}</span>
            <button onclick="showTenderDetail(\'${r.licitacion_id}\')" class="px-4 py-2 rounded-xl border border-[var(--border)] text-sm font-bold">Ver análisis</button><a href="${escapeHtml(r.url || r.detail_url)}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-[var(--blue)] text-white text-sm font-bold hover:opacity-90">Portal oficial</a>
          </div>
        </article>
      `).join('');
      document.getElementById('loadMoreBtn').classList.toggle('hidden', state.filtered.length <= state.visible);
    }





    function monthKey(d) {
      return d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : 'Sin fecha';
    }
    function makeChart(id, type, labels, values, label, color) {
      if (state.charts[id]) state.charts[id].destroy();
      state.charts[id] = new Chart(document.getElementById(id), {
        type,
        data: { labels, datasets: [{ label, data: values, backgroundColor: color, borderColor: color, borderRadius: 10, tension: .35, fill: type === 'line' }] },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { padding: 12, cornerRadius: 10 } },
          scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: '#edf2f7' } } }
        }
      });
    }


    function sortValue(row, field) {
      if (field === 'importe_total') return row.__amount;
      if (field === 'presentacion_hasta') return row.__deadline?.getTime() || 0;
      return safeText(row[field] ?? row[`__${field}`]).toLowerCase();
    }
    function renderTable() {
      const rows = [...state.filtered].sort((a, b) => {
        const av = sortValue(a, state.sort.field);
        const bv = sortValue(b, state.sort.field);
        if (av < bv) return state.sort.direction === 'asc' ? -1 : 1;
        if (av > bv) return state.sort.direction === 'asc' ? 1 : -1;
        return 0;
      });
      const pages = Math.max(1, Math.ceil(rows.length / state.pageSize));
      state.tablePage = Math.min(state.tablePage, pages);
      const pageRows = rows.slice((state.tablePage - 1) * state.pageSize, state.tablePage * state.pageSize);
      document.getElementById('pageInfo').textContent = `Página ${state.tablePage} de ${pages}`;
      document.getElementById('prevPageBtn').disabled = state.tablePage <= 1;
      document.getElementById('nextPageBtn').disabled = state.tablePage >= pages;
      document.getElementById('tableBody').innerHTML = pageRows.map(r => `
        <tr>
          <td class="py-3 pr-3 min-w-[240px] font-bold">${escapeHtml(r.title)}</td>
          <td class="py-3 pr-3">${escapeHtml(r.expediente)}</td>
          <td class="py-3 pr-3 min-w-[210px]">${escapeHtml(r.__org)}</td>
          <td class="py-3 pr-3 font-bold">${formatEuro(r.__amount)}</td>
          <td class="py-3 pr-3">${r.__deadline ? r.__deadline.toLocaleDateString('es-ES') : '-'}</td>
          <td class="py-3 pr-3">${escapeHtml(r.__cpv)}</td>
          <td class="py-3 pr-3"><span class="text-xs font-bold px-2 py-1 rounded-full border ${r.__probability.cls}">${r.__probability.score}%</span></td>
        </tr>
      `).join('');
    }

    function renderAll() {
      renderCards()
    }

    function bindEvents() {
  document.getElementById('searchInput').addEventListener('input', e => {
    state.filters.q = safeText(e.target.value).toLowerCase();
    applyFilters();
  });

  document.getElementById('locationFilter').addEventListener('change', e => {
    state.filters.ubicacion = e.target.value;
    applyFilters();
  });

  document.getElementById('loadMoreBtn').addEventListener('click', () => {
    state.visible += 18;
    renderCards();
  });
}

async function fetchDashboardDataset() {
      const errors = [];
      for (const path of DATASET_PATHS) {
        try {
          const res = await fetch(path, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!Array.isArray(data)) throw new Error('JSON inválido');
          return data;
        } catch (err) {
          errors.push(`${path}: ${err.message}`);
        }
      }
      throw new Error(errors.join(' | '));
    }

    async function init() {
      renderSkeleton();
      try {
        const data = await fetchDashboardDataset();
        state.raw = enrich(data.filter(x => x && typeof x === 'object'));
        state.filtered = [...state.raw];
        renderFilters();
        bindEvents();
        applyFilters();
      } catch (err) {
        console.error('[GovAI] Error de carga:', err);
        document.getElementById('cardsContainer').innerHTML = '<div class="panel rounded-2xl p-8 text-center md:col-span-2 xl:col-span-3"><h3 class="text-xl font-extrabold text-red-700 mb-2">Error de carga</h3><p class="text-sm text-[var(--muted)]">No se pudo cargar el dataset de oportunidades.</p></div>';
      }
    }

    
function closeModal() {
  document.getElementById('detailModal').classList.add('hidden');
}

function showTenderDetail(id) {
  const lic = state.raw.find(x => String(x.licitacion_id) === String(id));
  if (!lic) return;

  document.getElementById('detailContent').innerHTML = `
    <div class="space-y-6">
      <div>
        <h3 class="text-2xl font-extrabold">${lic.titulo || '-'}</h3>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
        <div><b>Expediente:</b><br>${lic.expediente || '-'}</div>
        <div><b>Estado:</b><br>${lic.estado || '-'}</div>
        <div><b>Organismo:</b><br>${lic.organo_contratacion || '-'}</div>
        <div><b>Tipo contrato:</b><br>${lic.tipo_contrato || '-'}</div>
        <div><b>Procedimiento:</b><br>${lic.procedimiento_codigo || '-'}</div>
        <div><b>Ubicación:</b><br>${lic.lugar_ejecucion || '-'}</div>
        <div><b>Importe total:</b><br>${formatEuro(amount(lic.importe_total))}</div>
        <div><b>Importe sin impuestos:</b><br>${formatEuro(amount(lic.importe_sin_impuestos))}</div>
        <div><b>Fecha publicación:</b><br>${lic.fecha_publicacion || '-'}</div>
        <div><b>Fecha límite:</b><br>${lic.presentacion_hasta || '-'}</div>
        <div><b>Hora límite:</b><br>${lic.presentacion_hora || '-'}</div>
        <div><b>Duración:</b><br>${lic.contrato_duracion || '-'} ${lic.contrato_duracion_unidad || ''}</div>
        <div><b>CPV:</b><br>${lic.cpv_codes || '-'}</div>
        <div><b>Descripción CPV:</b><br>${lic.cpv_descripcion || '-'}</div>
        <div><b>Fuente:</b><br>${lic.fuente_publicacion || '-'}</div>
        <div><b>Tipo anuncio:</b><br>${lic.notice_types || '-'}</div>
      </div>

      <div>
        <a href="${lic.detail_url || lic.url || '#'}" target="_blank"
           class="inline-block px-4 py-2 rounded-xl bg-blue-600 text-white font-bold">
           Ver licitación oficial
        </a>
      </div>
    </div>`;

  document.getElementById('detailModal').classList.remove('hidden');
}


init();
  </script>

<div id="detailModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-5xl w-full max-h-[90vh] overflow-y-auto p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-extrabold">Ficha de Licitación</h2>
      <button onclick="closeModal()" class="text-gray-500 hover:text-black text-xl">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

</body>
</html>
